name: Google proxy preview

on:
  push:
    branches: [main]
    paths: [.github/workflows/proxy-preview.yml]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to build
        default: feat/google-http-proxy
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: google-proxy-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'totok22/MoePeek'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the proxy changes
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'feat/google-http-proxy' }}
          persist-credentials: false

      - name: Record build environment and source
        run: |
          mkdir -p build
          git rev-parse HEAD | tee build/source-commit.txt
          xcodebuild -version
          swift --version

      - name: Install Tuist
        uses: jdx/mise-action@v2

      - name: Configure local development signing
        run: |
          cat > Configurations/Signing.xcconfig <<'EOF'
          MOEPEEK_CODE_SIGN_STYLE = Manual
          MOEPEEK_CODE_SIGN_IDENTITY = -
          MOEPEEK_DEVELOPMENT_TEAM =
          SPARKLE_ED_PUBLIC_KEY = mtrdCtfHXDXLN/VhxGH+qwbj39c7sd3Yv+WS/UDwdf8=
          EOF

      - name: Resolve dependencies and generate the project
        run: |
          tuist install
          tuist generate --no-open
          xcodebuild -list -workspace MoePeek.xcworkspace

      - name: Run all tests
        run: |
          set -euo pipefail
          # A headless runner must not enter onboarding, permissions, or updater UI.
          # Compile all application logic and tests with a minimal AppKit test host;
          # restore the real application entry point before archiving the preview.
          cp Sources/App/MoePeekApp.swift build/MoePeekApp.original.swift
          trap 'cp build/MoePeekApp.original.swift Sources/App/MoePeekApp.swift' EXIT
          cat > Sources/App/MoePeekApp.swift <<'EOF'
          import AppKit

          @main
          struct MoePeekTestHost {
              @MainActor
              static func main() {
                  _ = NSApplicationMain(CommandLine.argc, CommandLine.unsafeArgv)
              }
          }
          EOF
          xcodebuild test \
            -workspace MoePeek.xcworkspace \
            -scheme MoePeek \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            | tee build/test.log

      - name: Verify recorded test results
        run: |
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult > build/test-summary.json
          xcrun xcresulttool get test-results tests --path build/Tests.xcresult > build/test-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('build/test-summary.json').read_text())
          print(json.dumps(summary, indent=2))
          assert summary['passedTests'] > 0, 'No tests executed'
          assert summary['failedTests'] == 0, 'Tests failed'
          assert 'GoogleTranslateProxyTests' in Path('build/test-tree.json').read_text(), 'Proxy tests not discovered'
          PY

      - name: Archive the test app
        run: |
          git diff --exit-code -- Sources
          xcodebuild archive \
            -workspace MoePeek.xcworkspace \
            -scheme MoePeek \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/MoePeek.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION=0.19.2 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tee build/archive.log

      - name: Package and verify the app
        run: |
          APP=build/MoePeek.xcarchive/Products/Applications/MoePeek.app
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/MoePeek"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/MoePeek-google-proxy-arm64.zip
          shasum -a 256 build/MoePeek-google-proxy-arm64.zip > build/SHA256SUMS.txt

      - name: Upload the test app
        uses: actions/upload-artifact@v4
        with:
          name: MoePeek-google-proxy-arm64
          path: |
            build/MoePeek-google-proxy-arm64.zip
            build/SHA256SUMS.txt
            build/source-commit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            build/*.log
            build/test-*.json
            build/*.xcresult
            build/source-commit.txt
          if-no-files-found: warn
          retention-days: 7
